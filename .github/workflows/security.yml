name: Security

on:
  schedule:
    # Weekly, Monday 06:30 UTC. Catches CVEs published against pinned
    # transitive dependencies that wouldn't surface in the per-PR audit
    # because nothing in the repo had changed.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: npm audit (scheduled)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Informational. New advisories should be triaged manually rather
    # than auto-failing the workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git operations after checkout, so the job never needs the
          # token afterwards. Left at the v7 default (true) it stays in
          # .git/config for every later step, including code fetched at
          # run time.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (lockfile only)
        # Skip lifecycle scripts to avoid running anything before audit.
        run: npm ci --ignore-scripts

      # There are no `dependencies`, so an `--omit=dev` scan is empty by
      # construction; the dev tree is the whole audit surface here.
      - name: npm audit (dev tree)
        run: npm audit --audit-level=moderate

      - name: npm audit (full report)
        # Everything, including low severity, for the run log.
        run: npm audit || true
